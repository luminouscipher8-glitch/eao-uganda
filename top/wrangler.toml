# Cloudflare Pages Configuration
name = "eao-uganda"
compatibility_date = "2024-01-24"
compatibility_flags = ["nodejs_compat"]

# Pages configuration (for direct wrangler deployment)
pages_build_output_dir = "eksfkm.readdy.co/dist"

# Environment variables must be configured in the Cloudflare dashboard or via `wrangler secret put`.
# Do not commit live values here.
[vars]
NODE_ENV = "production"

[env.production.vars]
NODE_ENV = "production"

[env.preview.vars]
NODE_ENV = "preview"

# KV namespace for caching (optional - comment out if not using)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# Build command for Cloudflare Pages
[build]
command = "cd eksfkm.readdy.co && npm ci --include=dev && npm run build"
