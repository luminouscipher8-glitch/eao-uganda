# Netlify configuration for Educate an Orphan Uganda
# Production-ready NGO web platform

[build]
  base = "top/eksfkm.readdy.co"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# API proxy to backend (Render) - MUST come first!
[[redirects]]
  from = "/api/*"
  to = "https://eao-uganda.onrender.com/api/:splat"
  status = 200
  force = true

# Redirects for SPA routing - MUST come after API proxy
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Temporary relaxed CSP for debugging
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' *; connect-src 'self' *; img-src 'self' data: *;"
    
    # Security Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache Control
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rate limiting (if using Netlify Functions)
[functions]
  directory = "netlify/functions"

# Environment variables for production
[context.production.environment]
  VITE_SUPABASE_URL = "https://db.https://merrqcqxvqvwfuohlxbs.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_5707Wm_xn45TSDx1haQyqg_hs71FryT"
  VITE_API_URL = "https://eao-uganda.onrender.com"

[context.deploy-preview.environment]
  VITE_SUPABASE_URL = "https://db.https://merrqcqxvqvwfuohlxbs.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_5707Wm_xn45TSDx1haQyqg_hs71FryT"
  VITE_API_URL = "https://eao-uganda.onrender.com"

# Edge functions for better performance
[[edge_functions]]
  path = "/api/*"
  function = "api-proxy"

# Form handling
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
